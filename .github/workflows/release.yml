name: Release

# The tag is an OUTPUT of a successful release build, not its trigger.
#
# A workflow triggered by a pushed tag leaves that tag behind when the build
# fails, and tags are immutable, so the only way out is to burn the next patch
# number. Here the run is dispatched with the intended version and the tag is
# created in the final step; if anything before it fails, no tag exists and the
# same version can simply be dispatched again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.0). Must not already exist.'
        required: true
        type: string
      dry_run:
        description: 'Build and package without creating the tag or the release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  MOD_ID: fhfpsunlock

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version input
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $version = $env:VERSION
          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Version must look like v1.2.3, got '$version'."
          }
          git rev-parse -q --verify "refs/tags/$version" > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $version already exists. Tags are immutable; pick the next version."
          }
          $manifest = (Get-Content "$env:MOD_ID.manifest.json" -Raw | ConvertFrom-Json).Version
          if ("v$manifest" -ne $version) {
            throw "Manifest version is $manifest but the release was dispatched as $version. Bump $env:MOD_ID.manifest.json first."
          }
          Write-Host "Releasing $version from $(git rev-parse --short HEAD)."

      - name: Setup build environment
        uses: ./.github/actions/setup-build
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Bootstrap Fahrenheit
        shell: pwsh
        run: pwsh tools/bootstrap.ps1

      - name: Build
        shell: pwsh
        run: pwsh build.ps1 -Configuration Release -OutDir .release/stage

      - name: Package release archive
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./.github/scripts/New-ReleasePackage.ps1 -ModId $env:MOD_ID -Tag $env:VERSION -StageDir .release/stage -OutDir .release

      - name: Generate release notes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./.github/scripts/New-ReleaseNotes.ps1 -ModId $env:MOD_ID -Tag $env:VERSION -Repository $env:GITHUB_REPOSITORY -OutFile .release/release-notes.md

      - name: Upload artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dryrun-${{ inputs.version }}
          path: |
            .release/*.zip
            .release/*.sha256
            .release/release-notes.md
          if-no-files-found: error

      # Creates the tag as part of publishing, from the commit this run built.
      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: true
          body_path: .release/release-notes.md
          files: |
            .release/${{ env.MOD_ID }}-mod-${{ inputs.version }}.zip
            .release/${{ env.MOD_ID }}-mod-${{ inputs.version }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
