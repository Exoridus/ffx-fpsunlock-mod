name: Setup build environment
description: >-
  Shared toolchain setup for CI and Release, so a green CI run exercises the
  same environment the release build gets. The .NET SDK builds the mod and
  Fahrenheit's managed core and runtime; MSBuild and vcpkg are needed only by
  the native stage0/stage1 loaders that the full package ships.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: "10.0.x"

runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    # The Fahrenheit checkout does not exist yet when this action runs, so its
    # package references enter the key through the pinned commit instead of
    # through a csproj glob.
    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('*.csproj', 'global.json', 'fahrenheit.release.ref') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Cache vcpkg archives
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: vcpkg-${{ runner.os }}-${{ hashFiles('fahrenheit.release.ref') }}
        restore-keys: vcpkg-${{ runner.os }}-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    # The loader projects use a vcpkg manifest, which MSBuild only honours once
    # the runner's vcpkg is integrated.
    - name: Bootstrap and integrate vcpkg
      shell: cmd
      run: |
        if "%VCPKG_INSTALLATION_ROOT%"=="" (
          echo ERROR: VCPKG_INSTALLATION_ROOT is not set on this runner.
          exit /B 1
        )
        pushd "%VCPKG_INSTALLATION_ROOT%"
        call bootstrap-vcpkg.bat -disableMetrics
        if errorlevel 1 exit /B 1
        call vcpkg integrate install
        if errorlevel 1 exit /B 1
        popd
